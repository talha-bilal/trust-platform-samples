# Portfolio demo: on-prem Keycloak + directory (LDAP/AD-style) + OIDC SSO
# Cloud: copy .env.example -> .env then run setup/fresh-deploy.ps1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - kc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-Demo Company}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-company.local}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
    ports:
      - "1389:389"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_started
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app-launcher:
    image: nginx:alpine
    ports:
      - "${APP_LAUNCHER_PORT:-3000}:80"
    volumes:
      - ./demo-apps/app-launcher:/usr/share/nginx/html:ro
      - ./demo-apps/config:/usr/share/nginx/html/config:ro

  hr-portal:
    image: nginx:alpine
    ports:
      - "${HR_PORTAL_PORT:-3001}:80"
    volumes:
      - ./demo-apps/hr-portal:/usr/share/nginx/html:ro
      - ./demo-apps/config:/usr/share/nginx/html/config:ro

  finance-portal:
    image: nginx:alpine
    ports:
      - "${FINANCE_PORTAL_PORT:-3002}:80"
    volumes:
      - ./demo-apps/finance-portal:/usr/share/nginx/html:ro
      - ./demo-apps/config:/usr/share/nginx/html/config:ro

volumes:
  kc_pg:
